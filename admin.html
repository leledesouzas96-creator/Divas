<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#70449c"><title>Administração | DIVAS</title><style>
:root{--purple:#70449c;--lilac:#a77bd1;--gold:#c7a35b;--ink:#292333;--muted:#746d7d;--line:#eadff3}*{box-sizing:border-box}body{margin:0;background:#f8f4fc;color:var(--ink);font:15px Arial,sans-serif}.wrap{width:min(900px,92%);margin:35px auto}.head{background:linear-gradient(135deg,#70449c,#a77bd1);color:white;padding:25px;border-radius:20px}.head h1{margin:0 0 8px}.panel{background:white;padding:22px;border-radius:18px;margin-top:18px;box-shadow:0 10px 35px #39204c12}.row{display:flex;gap:12px;flex-wrap:wrap;align-items:end}.field{display:grid;gap:7px;flex:1;min-width:180px}.field label{font-size:12px;font-weight:bold;color:#62566e}.field input{padding:12px;border:1px solid var(--line);border-radius:10px}button{border:0;border-radius:10px;padding:12px 16px;background:linear-gradient(135deg,#B99AE8,#64258F);color:white;font-weight:bold;cursor:pointer}button.secondary{background:#eee5f5;color:var(--purple)}button:disabled{opacity:.5}.msg{margin-top:12px;padding:12px;border-radius:10px;background:#F7EBC5;color:#59451d}.booking{border:1px solid var(--line);padding:16px;border-radius:14px;margin:12px 0}.booking h3{margin:0 0 8px}.muted{color:var(--muted);font-size:13px;line-height:1.6}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.status{display:inline-block;padding:5px 9px;border-radius:20px;background:#f4e8c9;font-size:11px;font-weight:bold}.status.confirmed{background:#e0f5e8;color:#17643a}.status.cancelled{background:#fde8e8;color:#8b2424}@media(max-width:520px){.wrap{margin:16px auto}.panel{padding:16px}}

:root{--gold:#D4AF37;--lilac:#B99AE8}
body{background:radial-gradient(circle at top right,#F0E5FB,transparent 38%),#F8F5FB}
.head h1{color:#64258F}
.panel{box-shadow:0 12px 34px rgba(77,35,111,.09);border-color:#E8DDF2}
button{background:linear-gradient(135deg,#B99AE8,#64258F)}
button.secondary{background:#F0E5FB;color:#64258F;border:1px solid #E1D2EF}
.booking{border-color:#E8DDF2;background:#fff}
.status{background:#F7EBC5;color:#59451d}
.status.confirmed{background:#e0f5e8;color:#17643a}
.status.cancelled{background:#fde8e8;color:#8b2424}

</style></head><body><main class="wrap"><header class="head"><h1>DIVAS · Painel Administrativo</h1><div>Área administrativa para consultar e gerenciar pedidos de horário.</div></header><section class="panel"><div class="row"><div class="field"><label for="token">Senha administrativa (ADMIN_TOKEN)</label><input id="token" type="password" autocomplete="current-password" placeholder="Cole o token configurado no Cloudflare"></div><div class="field"><label for="date">Filtrar por dia (opcional)</label><input id="date" type="date"></div><button id="load">Entrar / Atualizar</button></div><div id="message" aria-live="polite"></div></section><section class="panel"><h2>Agendamentos</h2><div id="list" class="muted">Entre para carregar os agendamentos.</div></section></main><script>
const API='https://divas-api.vezqoraai.workers.dev';let token='';const $=id=>document.getElementById(id);function say(t,bad=false){$('message').innerHTML='';const p=document.createElement('div');p.className='msg';p.style.background=bad?'#fde8e8':'#f4e8c9';p.style.color=bad?'#8b2424':'#59451d';p.textContent=t;$('message').append(p)}
function dateBR(s){if(!s)return '';const [y,m,d]=s.split('-');return `${d}/${m}/${y}`}
async function request(path,opts={}){const r=await fetch(API+path,{...opts,headers:{'Authorization':'Bearer '+token,'Content-Type':'application/json',...(opts.headers||{})}});const data=await r.json();if(!r.ok)throw new Error(data.error||'Falha na solicitação');return data}
async function load(){token=$('token').value.trim();if(!token){say('Informe o token administrativo.',true);return;}$('list').textContent='Carregando...';try{const q=$('date').value?'?date='+encodeURIComponent($('date').value):'';const data=await request('/api/admin/bookings'+q);render(data.bookings||[]);say(`${(data.bookings||[]).length} agendamento(s) encontrado(s).`);}catch(e){$('list').textContent='Não foi possível carregar.';say(e.message,true)}}
function render(items){$('list').innerHTML='';if(!items.length){$('list').textContent='Nenhum agendamento encontrado.';return;}items.forEach(b=>{const card=document.createElement('article');card.className='booking';const h=document.createElement('h3');h.textContent=`${b.start_time}–${b.end_time} · ${b.customer_name}`;card.append(h);const p=document.createElement('p');p.className='muted';p.textContent=`${dateBR(b.appointment_date)} · ${b.service_name} · ${b.customer_phone}`;card.append(p);const status=document.createElement('span');status.className='status '+b.status;status.textContent=b.status==='pending'?'PENDENTE':b.status==='confirmed'?'CONFIRMADO':'CANCELADO';card.append(status);if(b.notes){const n=document.createElement('p');n.className='muted';n.textContent='Observações: '+b.notes;card.append(n)}const actions=document.createElement('div');actions.className='actions';if(b.status!=='confirmed'){const c=document.createElement('button');c.textContent='Confirmar';c.onclick=()=>change(b.id,'confirmed');actions.append(c)}if(b.status!=='cancelled'){const x=document.createElement('button');x.className='secondary';x.textContent='Cancelar';x.onclick=()=>change(b.id,'cancelled');actions.append(x)}card.append(actions);$('list').append(card)})}
async function change(id,status){try{await request('/api/admin/bookings/'+id,{method:'PATCH',body:JSON.stringify({status})});say('Agendamento atualizado.');load()}catch(e){say(e.message,true)}}$('load').addEventListener('click',load);
</script></body></html>
